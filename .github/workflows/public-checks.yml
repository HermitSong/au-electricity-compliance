name: Public research checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  public-edition:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -B scripts/check_public_release.py
      - run: python -B scripts/check_public_release.py --staged
      - run: python -B scripts/build_search_index.py
      - run: python -B scripts/test_public_release.py
